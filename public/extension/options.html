<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Visual AI Agent - Settings</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f5f5f5;
      padding: 20px;
    }
    
    .container {
      max-width: 600px;
      margin: 0 auto;
      background: white;
      border-radius: 12px;
      padding: 30px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }
    
    h1 {
      font-size: 24px;
      margin-bottom: 30px;
      color: #333;
    }
    
    .setting-group {
      margin-bottom: 30px;
      padding-bottom: 20px;
      border-bottom: 1px solid #eee;
    }
    
    .setting-group:last-child {
      border-bottom: none;
    }
    
    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      color: #333;
    }
    
    input[type="number"],
    textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 14px;
      font-family: inherit;
    }
    
    input[type="number"]:focus,
    textarea:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }
    
    textarea {
      resize: vertical;
      min-height: 80px;
    }
    
    .help-text {
      font-size: 12px;
      color: #666;
      margin-top: 6px;
    }
    
    .url-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 10px;
    }
    
    .url-item {
      display: flex;
      gap: 8px;
    }
    
    .url-item input {
      flex: 1;
    }
    
    .url-item button {
      padding: 8px 12px;
      background: #ef4444;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
    }
    
    .url-item button:hover {
      background: #dc2626;
    }
    
    .button-group {
      display: flex;
      gap: 10px;
      margin-top: 30px;
    }
    
    button {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
    }
    
    .btn-save {
      background: #667eea;
      color: white;
    }
    
    .btn-save:hover {
      background: #5568d3;
      transform: translateY(-1px);
      box-shadow: 0 2px 8px rgba(102, 126, 234, 0.3);
    }
    
    .btn-add {
      background: #10b981;
      color: white;
      font-size: 12px;
      flex: 0 1 auto;
      padding: 8px 16px;
    }
    
    .btn-add:hover {
      background: #059669;
    }
    
    .status-message {
      padding: 12px;
      border-radius: 6px;
      margin-bottom: 20px;
      display: none;
    }
    
    .status-message.success {
      background: #dcfce7;
      color: #166534;
      display: block;
    }
    
    .status-message.error {
      background: #fee2e2;
      color: #991b1b;
      display: block;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>⚙️ Visual AI Agent Settings</h1>
    
    <div class="status-message" id="status-message"></div>
    
    <form id="settings-form">
      <div class="setting-group">
        <label for="screenshot-interval">Screenshot Interval (seconds)</label>
        <input type="number" id="screenshot-interval" name="screenshotInterval" min="10" max="3600" value="60">
        <div class="help-text">How often to capture screenshots (10 - 3600 seconds)</div>
      </div>
      
      <div class="setting-group">
        <label>
          <input type="checkbox" id="ai-analysis" name="aiAnalysisEnabled">
          Enable AI Analysis
        </label>
        <div class="help-text">Analyze screenshots with AI for content understanding</div>
      </div>
      
      <div class="setting-group">
        <label for="excluded-urls">Excluded URLs (one per line)</label>
        <textarea id="excluded-urls" name="excludedUrls" placeholder="https://example.com&#10;https://private.com"></textarea>
        <div class="help-text">Tracking will be disabled for these URLs</div>
      </div>
      
      <div class="setting-group">
        <label for="whitelisted-urls">Whitelisted URLs (one per line)</label>
        <textarea id="whitelisted-urls" name="whitelistUrls" placeholder="https://work.com&#10;https://project.com"></textarea>
        <div class="help-text">Only track these URLs if set (leave empty to track all except excluded)</div>
      </div>
      
      <div class="button-group">
        <button type="submit" class="btn-save">Save Settings</button>
      </div>
    </form>
  </div>
  
  <script src="options.js"></script>
</body>
</html>
